name: Update Profile Art

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours
  workflow_dispatch:       # manual trigger
  push:
    branches:
      - main
    paths-ignore:
      - 'contrib-heatmap.svg'
      - 'data/**'
      - 'README.md'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper deps
        run: pip install -r scripts/requirements.txt

      - name: Fetch contributions
        env:
          GH_PROFILE_USER: Vruxak21
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_contributions.py

      - name: Render heatmap SVG
        run: python scripts/render_heatmap_svg.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # If contrib-heatmap.svg or data/contributions.json changed, bust cache in README.md
          if ! git diff --quiet contrib-heatmap.svg data/contributions.json; then
            python3 -c 'import re, time; f=open("README.md", "r+"); t=re.sub(r"contrib-heatmap\.svg(\?v=[^\"]*)?", "contrib-heatmap.svg?v=" + str(int(time.time())), f.read()); f.seek(0); f.write(t); f.truncate(); f.close()'
            git add contrib-heatmap.svg data/contributions.json README.md
            git commit -m "chore: refresh contribution graph [skip ci]"
            git pull --rebase origin main
            git push
          fi
